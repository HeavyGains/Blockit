<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1d2433">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="BLOCKIT">
  <meta name="mobile-web-app-capable" content="yes">
  <title>BLOCKIT</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="top">
    <h1 class="logo">BLOCKIT</h1>
    <div class="scorebox">
      <span id="score" class="score" aria-live="polite">0</span>
      <span id="streak" class="streak" hidden></span>
    </div>
    <button id="player" class="best" type="button" aria-label="Switch player">
      <span id="who" class="who">Jason</span>
      <span class="best-label">Best <b id="best">0</b></span>
    </button>
  </header>

  <main>
    <div id="board" class="board" role="grid" aria-label="Board"></div>
    <div id="tray" class="tray" aria-label="Pieces"></div>
  </main>

  <div id="drag" class="drag" hidden></div>

  <div id="over" class="overlay" hidden>
    <div class="sheet">
      <h2>No moves left</h2>
      <p class="final"><span id="final">0</span></p>
      <p id="newbest" class="newbest" hidden>New best!</p>
      <p class="hint">None of your pieces fit on the board.</p>
      <button id="again" class="primary-btn" type="button">Play again</button>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
