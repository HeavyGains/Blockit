<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1d2433">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="BLOCKIT">
  <meta name="mobile-web-app-capable" content="yes">
  <title>BLOCKIT</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="stylesheet" href="css/style.css?v=56">
  <link rel="stylesheet" href="css/styles.css?v=56">
  <script>
    // Set the saved style before the page draws, so it doesn't flash.
    try {
      const p = JSON.parse(localStorage.getItem('blockit.player')) || 'Jason';
      const s = JSON.parse(localStorage.getItem('blockit.style')) || {};
      document.documentElement.dataset.style = s[p] || 'paper';
    } catch { document.documentElement.dataset.style = 'paper'; }
  </script>
</head>
<body>
  <header class="top">
    <div class="brand">
      <h1 class="logo" aria-label="Blockit"><i>B</i><i>L</i><i>O</i><i>C</i><i>K</i><i>I</i><i>T</i></h1>
      <button id="palette" class="icon-btn" type="button" aria-label="Change style">🎨</button>
    </div>
    <div class="scorebox">
      <span id="score" class="score" aria-live="polite">0</span>
      <span id="streak" class="streak" hidden></span>
      <button id="modetag" class="modetag" type="button" aria-label="Game mode">Classic</button>
    </div>
    <button id="player" class="best" type="button" aria-label="Switch player">
      <span id="who" class="who">Jason</span>
      <span class="best-label">Best <b id="best">0</b></span>
    </button>
  </header>

  <main>
    <div id="board" class="board" role="grid" aria-label="Board"></div>
    <div id="tray" class="tray" aria-label="Pieces"></div>
  </main>

  <div id="drag" class="drag" hidden></div>

  <div id="over" class="overlay" hidden>
    <div class="sheet">
      <h2>No moves left</h2>
      <p class="final"><span id="final">0</span></p>
      <p id="newbest" class="newbest" hidden>New best!</p>
      <p class="hint">None of your pieces fit on the board.</p>
      <button id="again" class="primary-btn" type="button">Play again</button>
      <button id="over-alt" class="text-btn" type="button" hidden>Play Classic</button>
    </div>
  </div>

  <div id="styles" class="overlay" hidden>
    <div class="sheet">
      <h2>Style</h2>
      <div id="styletabs" class="chips"></div>
      <div id="swatches" class="swatches"></div>
      <button id="styles-close" class="text-btn" type="button">Done</button>
    </div>
  </div>

  <div id="scores" class="overlay" hidden>
    <div class="sheet">
      <h2>🏆 Scoreboard</h2>
      <div id="scoretabs" class="chips"></div>
      <div id="scorekinds" class="chips"></div>
      <ol id="scorelist" class="scorelist"></ol>
      <p id="scorenote" class="hint small"></p>
      <button id="scores-close" class="text-btn" type="button">Close</button>
    </div>
  </div>

  <div id="players" class="overlay" hidden>
    <div class="sheet">
      <h2 id="players-title">Who's playing?</h2>
      <div id="playerlist" class="modelist"></div>
      <form id="nameform" class="nameform" autocomplete="off">
        <input id="name" type="text" maxlength="12" placeholder="New player name" aria-label="Your name" enterkeyhint="done">
        <button id="name-go" class="primary-btn" type="submit">Add</button>
      </form>
      <button id="players-close" class="text-btn" type="button">Close</button>
    </div>
  </div>

  <div id="modes" class="overlay" hidden>
    <div class="sheet">
      <h2>Game</h2>
      <div id="modelist" class="modelist"></div>
      <button id="specials" class="toggle-btn" type="button" aria-pressed="false">
        <span>Special blocks 💣 🪨 ⭐</span><b>Off</b>
      </button>
      <button id="duel" class="toggle-btn" type="button" aria-pressed="false">
        <span>Daily Duel 📅</span><b>Off</b>
      </button>
      <button id="sound" class="toggle-btn" type="button" aria-pressed="true">
        <span>Sound 🔊</span><b>On</b>
      </button>
      <button id="haptics" class="toggle-btn" type="button" aria-pressed="true">
        <span>Haptics 📳</span><b>On</b>
      </button>
      <p class="hint small">Each mode, with or without specials, keeps its own game and best. Daily Duel: same pieces for everyone today, one try each.</p>
      <button id="start" class="primary-btn" type="button">Start</button>
      <button id="newgame" class="text-btn" type="button">New game</button>
      <button id="scores-open" class="text-btn" type="button">🏆 Scoreboard</button>
      <button id="modes-close" class="text-btn" type="button">Close</button>
    </div>
  </div>

  <script type="module" src="js/app.js?v=56"></script>
  <script>
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' });
  </script>
</body>
</html>
